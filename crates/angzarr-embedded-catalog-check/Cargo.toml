[package]
name = "angzarr-embedded-catalog-check"
version = "0.1.0"
description = "Test-only: every error code in angzarr-embedded has a message, using exactly its args, in every shipped Fluent catalog. Part of angzarr-embedded, angzarr's in-app runtime (embedded in your application, not a microcontroller); for the distributed system see angzarr core, https://github.com/angzarr-io/angzarr."
edition.workspace = true
license.workspace = true
publish.workspace = true
# It reads angzarr-embedded's samples, so it needs what angzarr-embedded needs.
rust-version = "1.89"

# No library to speak of and no dependencies: the check is src/lib.test.rs.
[dependencies]

# fluent-syntax (Apache-2.0 OR MIT) parses the catalogs. Test-only: nothing
# in angzarr-embedded renders Fluent; the game client does.
[dev-dependencies]
angzarr-embedded = { path = "../angzarr-embedded" }
angzarr-embedded-diagnostic = { path = "../angzarr-embedded-diagnostic" }
angzarr-embedded-graph = { path = "../angzarr-embedded-graph" }
angzarr-embedded-host = { path = "../angzarr-embedded-host" }
angzarr-store-sqlite = { path = "../angzarr-store-sqlite" }
# angzarr-ports' Arg, to read the adapter's errors, which are in its style.
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "b0a680fd1d8cdfaef9baace879b6b6adbeeca22a" }
angzarr-embedded-yaml = { path = "../angzarr-embedded-yaml" }
fluent-syntax = "0.12"
# fluent-bundle (Apache-2.0 OR MIT) renders each sample's message with its
# args, so a message naming an arg its error may not give fails here, not in
# the client.
fluent-bundle = "0.16"

[lints]
workspace = true
