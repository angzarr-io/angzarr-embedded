[package]
name = "annals-angzarr"
version = "0.1.0"
description = "annals on angzarr's wire contract: books, provenance, Any payloads, type-URL upcasting, opaque storage rows."
edition.workspace = true
license.workspace = true
publish.workspace = true
# prost 0.14 needs 1.85; the rest of the workspace keeps its lower floor.
rust-version = "1.85"

# The kernel stays dependency-free; everything protobuf about angzarr is
# here. angzarr-proto is angzarr's own prost crate for io.angzarr.v1
# (pinned: it is a git dependency only, and its build needs protoc on PATH).
# prost and prost-types are the versions angzarr-proto generates for, so
# its messages and ours are the same types.
[dependencies]
annals = { path = "../annals" }
annals-diagnostic = { path = "../annals-diagnostic" }
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr-project", rev = "9cfed59fd2ea92e731fcc8082c971c7e1c650c07" }
prost = "0.14"
prost-types = "0.14"

[lints]
workspace = true
