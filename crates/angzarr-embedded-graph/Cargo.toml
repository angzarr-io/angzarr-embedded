[package]
name = "angzarr-embedded-graph"
version = "0.1.0"
description = "A small, deterministic graph: typed ids, tags, queries and search. Part of angzarr-embedded, angzarr's in-app runtime (embedded in your application, not a microcontroller); for the distributed system see angzarr core, https://github.com/angzarr-io/angzarr."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Zero dependencies beyond angzarr-embedded-diagnostic, and nothing from any game that
# uses it.
[dependencies]
angzarr-embedded-diagnostic = { path = "../angzarr-embedded-diagnostic" }

[lints]
workspace = true
