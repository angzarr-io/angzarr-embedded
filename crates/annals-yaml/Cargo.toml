[package]
name = "annals-yaml"
version = "0.1.0"
description = "A strict subset of YAML, read and written, with no type coercion."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Zero dependencies beyond annals-diagnostic, and nothing from any game that
# uses it.
[dependencies]
annals-diagnostic = { path = "../annals-diagnostic" }

# Test-only: annals-sim's seeded Rng drives the round-trip property test.
[dev-dependencies]
annals-sim = { path = "../annals-sim" }

[lints]
workspace = true
