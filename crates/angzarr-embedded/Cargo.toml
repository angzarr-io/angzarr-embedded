[package]
name = "angzarr-embedded"
version = "0.1.0"
description = "angzarr's in-app runtime: a small, deterministic event-sourcing engine (decide, emit, apply, replay) run inside your application's process, embedded in your application, not a microcontroller. For the distributed system see angzarr core, https://github.com/angzarr-io/angzarr."
edition.workspace = true
license.workspace = true
publish.workspace = true
# prost 0.14 (through angzarr-proto) needs 1.85.
rust-version = "1.85"

# The kernel operates on angzarr's wire types directly (`angzarr_embedded::next`), so
# it depends on angzarr-proto: angzarr's own prost crate for io.angzarr.v1,
# a git dependency pinned by rev, whose build needs `protoc`. prost and
# prost-types are the versions angzarr-proto generates for, so its messages
# and the kernel's are the same types. Dependency-freeness was given up for
# this deliberately: see docs/design/audit.md, *Layering*.
[dependencies]
angzarr-embedded-diagnostic = { path = "../angzarr-embedded-diagnostic" }
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr-project", rev = "b0a680fd1d8cdfaef9baace879b6b6adbeeca22a" }
prost = "0.14"
prost-types = "0.14"
# angzarr's shared storage contract (one async trait set, its errors and
# codes): angzarr-embedded's store ports are these, pinned with angzarr-proto at the
# same rev of angzarr-project's spec line, so both share one set of wire
# types.
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "b0a680fd1d8cdfaef9baace879b6b6adbeeca22a" }
# angzarr's shared client router: business dispatch (handlers, typed
# refusals and the refusal path), implemented once for every runtime. The
# kernel calls it and keeps the check, identification, admission,
# upcasting, snapshots, a policy's output checks, the store writes,
# positions and resume.
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "1dca8adfbc2bd2b744cc80f1b058188a717ece69" }

# The kernel's tests run on angzarr-ports' MemoryStore and, on a tokio
# runtime, on the shared SQLite adapter (sqlite.test.rs); and a decorated
# aggregate (`next/decorated.test.rs`) through angzarr-embedded-macros, whose expansion
# names `::angzarr-embedded`.
[dev-dependencies]
angzarr-embedded = { path = "." }
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "b0a680fd1d8cdfaef9baace879b6b6adbeeca22a", features = ["memory"] }
angzarr-embedded-macros = { path = "../angzarr-embedded-macros" }
angzarr-store-sqlite = { path = "../angzarr-store-sqlite" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
