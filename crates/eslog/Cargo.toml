[package]
name = "eslog"
version = "0.1.0"
description = "A binary event-log format for es streams: length-delimited protobuf."
edition.workspace = true
license.workspace = true
publish.workspace = true
# prost 0.14 needs 1.85; the rest of the workspace keeps its lower floor.
rust-version = "1.85"

# The one crate here with a third-party dependency: prost, the protobuf
# runtime the hand-written wire types derive from. prost 0.14 is also what
# protoc-gen-prost 0.5.0 generates for, so the codegen check compares like
# with like.
[dependencies]
es = { path = "../es" }
prost = "0.14"

[features]
# Runs tests/codegen.rs, which checks the hand-written types against the ones
# `buf generate` writes into gen/. Needs `just gen` first; `just test` turns
# it on.
codegen-check = []
