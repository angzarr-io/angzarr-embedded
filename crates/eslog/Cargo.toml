[package]
name = "eslog"
version = "0.1.0"
description = "A binary event-log format for es streams: length-delimited protobuf."
edition.workspace = true
# prost 0.14 needs 1.85; the rest of the workspace keeps its lower floor.
rust-version = "1.85"

# The one crate here with a third-party dependency: prost, the protobuf
# runtime the code generated into gen/ is written against. prost 0.14 is what
# protoc-gen-prost 0.5.0 generates for.
[dependencies]
es = { path = "../es" }
prost = "0.14"
