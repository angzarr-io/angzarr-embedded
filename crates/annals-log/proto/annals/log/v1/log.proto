// The binary event-log format.
//
// A log is a stream of length-delimited messages (each one a varint byte
// length, then the message): first one LogHeader, then one Envelope per event,
// in sequence order.
//
// Envelope carries its event as `bytes` in field 3. On the wire an embedded
// message and a `bytes` field are the same thing — wire type 2, a length, the
// encoded message — so a domain may declare its own typed envelope,
//
//   message MyEnvelope {
//     uint64 seq = 1;
//     optional uint64 cause = 2;
//     MyEvent event = 3;
//   }
//
// and read or write the same bytes as this generic one. Tools that know no
// domain read every log through Envelope; a domain reads it typed.
//
// Ticked domains. A domain whose events happen on a clock declares the tick
// as the first field of its event message:
//
//   message MyEvent {
//     uint64 tick = 1;
//     ...
//   }
//
// Readers can then check that ticks never decrease along seq, and seek by
// tick, by reading field 1 straight from the event bytes without knowing the
// domain's schema. A domain that is not ticked leaves field 1 to its own use
// and does not ask for either.
syntax = "proto3";

package annals.log.v1;

// What a stream is, stamped once at the head of its log.
message LogHeader {
  // The stream's id.
  uint64 stream_id = 1;
  // Which domain the events belong to.
  string domain = 2;
  // The event schema version: what an upcaster reads.
  uint32 schema_version = 3;
  // The rules and content the events were decided under.
  string rules_version = 4;
}

// One stored event.
//
// A reader checks, as it streams, that `seq` runs 0, 1, 2… with no gap and
// that every `cause` is an earlier seq: what annals::Stream::replay checks.
message Envelope {
  // The event's position in its stream, from 0.
  uint64 seq = 1;
  // The earlier event this one follows from, if any.
  optional uint64 cause = 2;
  // The domain's event message, encoded.
  bytes event = 3;
}
