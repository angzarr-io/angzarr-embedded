[package]
name = "angzarr-embedded-host"
version = "0.1.0"
description = "Hosts an angzarr-embedded application's remote components (domains, policies, projectors): launches each as a child process, waits for its gRPC health to report SERVING on a Unix socket, describes and supervises it, and hands each back to the kernel by its kind. Part of angzarr-embedded, angzarr's in-app runtime; for the distributed system see angzarr core, https://github.com/angzarr-io/angzarr."
edition.workspace = true
license.workspace = true
publish.workspace = true
# uuid 1.28 (through angzarr-proto) needs 1.89; tonic 0.14.8 and its
# companions (tonic-prost, tonic-types, tonic-health) need 1.88.
rust-version = "1.89"

# A remote component is a child process serving angzarr's
# CommandHandlerService, PolicyService or ProjectorService, and
# ComponentService, over gRPC on a Unix socket (the go-plugin model), so
# this crate needs a gRPC client (tonic, with its prost codec), the async
# runtime it runs on (tokio), and the connector glue for a Unix socket
# (tower, hyper-util), all of which tonic itself depends on; google.rpc's
# Status and ErrorInfo come from tonic-types (its maintained prost types,
# at tonic's version), and grpc.health.v1, which an upcaster sidecar
# serves, from tonic-health (its messages and client, at tonic's version).
# The handlers it builds are angzarr-router's (CommandHandler, PolicyComponent, ProjectorHandler),
# on the router's types, so angzarr-router and angzarr-proto are pinned at
# the revs the router itself names: ONE angzarr-proto in the graph. The
# gRPC client and server stubs are angzarr-proto-component's (the spec's
# component contract, io.angzarr.component.v1, on angzarr-proto's messages),
# and the child protocol's constants and keys
# angzarr-proto-transport-embedded's (the local-process transport), both at
# angzarr-proto's core rev (decision 14.64), not this crate's.
[dependencies]
# The kernel's Registry, which Host::register fills with the remote
# domains.
angzarr-embedded = { path = "../angzarr-embedded" }
# The config's schema and its versioned loader: angzarr.yaml, which the CLI
# writes, read strictly.
angzarr-embedded-host-config = { path = "../angzarr-embedded-host-config" }
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "415b29ee7930db9a929af244808c6bda6f6a8260" }
# The store `run` opens: SQLite, at the config's [store] path or in memory.
angzarr-store-sqlite = { path = "../angzarr-store-sqlite" }
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr", rev = "415b29ee7930db9a929af244808c6bda6f6a8260" }
angzarr-proto-component = { git = "https://github.com/angzarr-io/angzarr", rev = "415b29ee7930db9a929af244808c6bda6f6a8260" }
angzarr-proto-transport-embedded = { git = "https://github.com/angzarr-io/angzarr", rev = "415b29ee7930db9a929af244808c6bda6f6a8260" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "e79400c3a8233da131498b700e434a86f8f1de99" }
hyper-util = { version = "0.1", features = ["tokio"] }
# SIGTERM for a child that outlives its stdin at shutdown: tokio's Child
# sends only SIGKILL. In the graph already, through tokio.
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"
tonic-types = "0.14"
tonic-health = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }

# The fake child the tests launch serves the generated server stubs over a
# Unix socket (tonic's router, tokio-stream's UnixListenerStream, both in
# the graph through tonic).
# The kernel test runs on angzarr-ports' MemoryStore (the kernel's own
# store contract, at its rev).
[dev-dependencies]
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr", rev = "415b29ee7930db9a929af244808c6bda6f6a8260", features = ["memory"] }
tonic = { version = "0.14", default-features = false, features = ["router"] }
tokio-stream = { version = "0.1", features = ["net"] }
# The tests' scratch directories and files: angzarr core's one guard. std
# alone and no shared type, so it is pinned at the first core rev that has
# it, ahead of the rev the router and the rest of core are pinned at.
angzarr-test-dir = { git = "https://github.com/angzarr-io/angzarr", rev = "415b29ee7930db9a929af244808c6bda6f6a8260" }

# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
[build-dependencies]
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "415b29ee7930db9a929af244808c6bda6f6a8260", features = ["build"] }

[lints]
workspace = true
