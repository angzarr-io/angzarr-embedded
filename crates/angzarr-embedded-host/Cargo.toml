[package]
name = "angzarr-embedded-host"
version = "0.1.0"
description = "Hosts an angzarr-embedded application's remote domains: launches each as a child process, reads its handshake, connects over gRPC on a Unix socket, describes and supervises it, and hands each back as an angzarr-router CommandHandler. Part of angzarr-embedded, angzarr's in-app runtime; for the distributed system see angzarr core, https://github.com/angzarr-io/angzarr."
edition.workspace = true
license.workspace = true
publish.workspace = true
# prost 0.14 and tonic 0.14 need 1.85.
rust-version = "1.85"

# A remote domain is a child process serving angzarr's CommandHandlerService
# and ComponentService over gRPC on a Unix socket (the go-plugin model), so
# this crate needs a gRPC client (tonic, with its prost codec), the async
# runtime it runs on (tokio), and the connector glue for a Unix socket
# (tower, hyper-util), all of which tonic itself depends on; google.rpc's
# Status and ErrorInfo are two hand-written prost messages (src/rpc.rs), not
# a crate. serde derives the config. The handler it builds is angzarr-router's CommandHandler,
# on the router's types, so angzarr-router and angzarr-proto are pinned at
# the revs the router itself names: ONE angzarr-proto in the graph.
[dependencies]
# The kernel's Registry, which Host::register fills with the remote
# domains.
angzarr-embedded = { path = "../angzarr-embedded" }
angzarr-embedded-diagnostic = { path = "../angzarr-embedded-diagnostic" }
# The store `run` opens: SQLite, at the config's [store] path or in memory.
angzarr-store-sqlite = { path = "../angzarr-store-sqlite" }
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr-project", rev = "55eab0f7225ecd5ed63aa74a766d2f16b2735be2" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "6be9159962b4d3beffa3936855a55b6469ca0cc7" }
hyper-util = { version = "0.1", features = ["tokio"] }
# SIGTERM for a child that outlives its stdin at shutdown: tokio's Child
# sends only SIGKILL. In the graph already, through tokio.
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
# `run` reads the application's angzarr.toml, which the CLI writes.
toml = "0.9"

# The fake child the tests launch serves the generated server stubs over a
# Unix socket (tonic's router, tokio-stream's UnixListenerStream, both in
# the graph through tonic); the config's serde shape is checked through
# serde_json, in the graph already (through sqlx).
# The kernel test runs on angzarr-ports' MemoryStore (the kernel's own
# store contract, at its rev).
[dev-dependencies]
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "55eab0f7225ecd5ed63aa74a766d2f16b2735be2", features = ["memory"] }
serde_json = "1"
tonic = { version = "0.14", default-features = false, features = ["router"] }
tokio-stream = { version = "0.1", features = ["net"] }

# The gRPC stubs are written from Rust types with tonic-build's manual
# builder, not from .proto files: angzarr-proto compiles no services and
# ships no service protos, and the stubs' messages are angzarr-router's
# (its pb, which is angzarr-proto's types plus CommandHandlerResponse).
[build-dependencies]
tonic-build = { version = "0.14", default-features = false, features = ["transport"] }

[lints]
workspace = true
