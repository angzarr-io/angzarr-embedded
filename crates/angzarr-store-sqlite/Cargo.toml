[package]
name = "angzarr-store-sqlite"
version = "0.1.0"
description = "angzarr-ports on SQLite: the shared store adapter annals and angzarr both use, its schema and migrations, held to the ports' conformance suite."
edition.workspace = true
license.workspace = true
publish.workspace = true
# sqlx 0.8 and prost 0.14 (through angzarr-proto) need 1.85.
rust-version = "1.85"

# A LEAF: angzarr-ports (and the wire types through it) and SQL, nothing of
# annals (`a_store_depends_on_nothing_of_annals`), so angzarr's runtimes use
# it as annals does. Third-party by design (see CLAUDE.md): a SQL store needs
# a query builder and a driver, and hand-rolling either is a second,
# unchecked implementation of the dialect.
[dependencies]
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "4be6a684d46110909811c0e30cf5a135d7134e6a" }
prost = "0.14"
prost-types = "0.14"
sea-query = "0.32"
sea-query-binder = { version = "0.7", features = ["sqlx-sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }

# The conformance suite, run on this store under tokio.
[dev-dependencies]
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "4be6a684d46110909811c0e30cf5a135d7134e6a", features = ["contract"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
