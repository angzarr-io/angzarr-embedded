[package]
name = "annals-macros"
version = "0.1.0"
description = "Markup over hand-written aggregates, process managers, policies and projectors that generates their annals glue."
edition.workspace = true
license.workspace = true
publish.workspace = true
# Its doc tests build annals, which needs 1.85.
rust-version = "1.85"

[lib]
proc-macro = true

# syn, quote and proc-macro2 are compile-time only and already in the graph
# through prost-derive; each is pinned to the version prost-derive resolves
# in Cargo.lock, so adding them adds no new crate (see CLAUDE.md, *Few
# dependencies*).
[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }

# The doc tests are aggregates on annals, with prost messages as their wire
# types.
[dev-dependencies]
annals = { path = "../annals" }
annals-diagnostic = { path = "../annals-diagnostic" }
prost = "0.14"

[lints]
workspace = true
