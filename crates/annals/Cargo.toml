[package]
name = "annals"
version = "0.1.0"
description = "A small, deterministic event-sourcing engine: decide, emit, apply, replay."
edition.workspace = true
license.workspace = true
publish.workspace = true
# prost 0.14 (through angzarr-proto) needs 1.85.
rust-version = "1.85"

# The kernel operates on angzarr's wire types directly (`annals::next`), so
# it depends on angzarr-proto: angzarr's own prost crate for io.angzarr.v1,
# a git dependency pinned by rev, whose build needs `protoc`. prost and
# prost-types are the versions angzarr-proto generates for, so its messages
# and the kernel's are the same types. Dependency-freeness was given up for
# this deliberately: see docs/design/audit.md, *Layering*.
[dependencies]
annals-diagnostic = { path = "../annals-diagnostic" }
angzarr-proto = { git = "https://github.com/angzarr-io/angzarr-project", rev = "4be6a684d46110909811c0e30cf5a135d7134e6a" }
prost = "0.14"
prost-types = "0.14"
# angzarr's shared storage contract (one async trait set, its errors and
# codes): annals' store ports are these, pinned with angzarr-proto at the
# same rev of angzarr-project's spec line, so both share one set of wire
# types.
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "4be6a684d46110909811c0e30cf5a135d7134e6a" }

# The kernel's tests run on angzarr-ports' MemoryStore and, on a tokio
# runtime, on the shared SQLite adapter (sqlite.test.rs); and a decorated
# aggregate (`next/decorated.test.rs`) through annals-macros, whose expansion
# names `::annals`.
[dev-dependencies]
annals = { path = "." }
angzarr-ports = { git = "https://github.com/angzarr-io/angzarr-project", rev = "4be6a684d46110909811c0e30cf5a135d7134e6a", features = ["memory"] }
annals-macros = { path = "../annals-macros" }
angzarr-store-sqlite = { path = "../angzarr-store-sqlite" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
