# cargo-deny: what may enter the dependency graph. `just lint-deps` runs it.
#
# angzarr-embedded keeps few dependencies on purpose (CLAUDE.md, *Few dependencies, no
# domain*); this file is the machine check that what does enter is
# permissively licensed, comes from crates.io or a pinned, named git repo,
# and has no open RustSec advisory.

[graph]
# Every feature, judged, not only the default build.
all-features = true

[advisories]
version = 2
# RustSec advisories. An ignore needs the advisory id and why it does not
# apply here.
# RUSTSEC-2026-0459: the SQLite the store bundles (libsqlite3-sys 0.30.1)
# can return uninitialized page-cache memory when a process opens a database
# together with a `-wal` sibling of a different page size. The exposure needs
# a database plus -wal sibling written by a less trusted party; the databases
# here are the user's own. Delete this ignore when the SQLite store moves to
# libsqlite3-sys >= 0.39.
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via the store; databases are the user's own; upstream bump pending" },
]

[licenses]
version = 2
# angzarr-embedded is Apache-2.0 OR BSD-3-Clause and used as a library by applications under other
# licences, so a dependency's licence must be permissive: it must not impose
# its terms on angzarr-embedded or on what links it. Copyleft is not on this list.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# angzarr-proto (angzarr's wire types, which angzarr-embedded's kernel
# operates on directly) and angzarr-ports (the shared store contract the
# kernel and angzarr-store-sqlite implement and use) are angzarr core's, and
# Apache-2.0 OR BSD-3-Clause like the rest: on the list above, with no
# exception. Any copyleft crate fails here.

[licenses.private]
# Not ignored: angzarr-embedded's own crates are `publish = false`, and so are
# angzarr-proto and angzarr-ports, whose licences are checked like any
# other's.
ignore = false

[bans]
# Duplicate versions warn, not fail: they are logged by the gate, and most
# come from upstream trees (sqlx) that angzarr-embedded does not control.
multiple-versions = "warn"
wildcards = "deny"
# A path dependency has no version; allowed for unpublished crates only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # angzarr's wire contract (angzarr-proto), store contract
  # (angzarr-ports) and localizable errors (angzarr-diagnostic): angzarr
  # core's shared crates, pinned by one rev.
  "https://github.com/angzarr-io/angzarr",
  # angzarr's shared client router (BSD-3-Clause), which the kernel calls
  # for business dispatch, pinned by rev.
  "https://github.com/angzarr-io/angzarr-router",
]
