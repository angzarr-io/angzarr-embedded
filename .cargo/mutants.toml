# cargo-mutants (https://mutants.rs): `just mutants` runs it after `just gen`.
#
# Test code is not mutated: a test is what judges a mutant, so a mutant in
# one measures the measure. cargo-mutants skips a module under a bare
# `#[cfg(test)]`, but not one under `#[cfg(all(test, feature = ...))]`, as
# annals-log's codegen check is; the glob names every test file instead.
# That covers annals-log's generated protobuf (crates/annals-log/gen) too:
# it is reached only by `include!` from src/codegen.test.rs.
exclude_globs = ["*.test.rs"]

# Otherwise excluded: only the mutants in `exclude_re` below, each equivalent
# (no test can tell it from the code), each matched alone by its description, grouped by crate.
#
# Not excluded, though they might have been:
# - annals-catalog-check's src/lib.rs holds no code; its check is a test.
# - Display impls are not noise: annals-catalog-check fails an empty English
#   Display, so with test_workspace those mutants are caught.

# Run every crate's tests against each mutant: annals-catalog-check tests the
# other crates' Diagnostic codes, args and Display, from outside them.
test_workspace = true

# The codegen-check feature is not set here but by `just mutants`: cargo
# refuses `--features annals-log/codegen-check` when the unmutated baseline
# builds only a crate that does not depend on annals-log.

# Copy gitignored files into the scratch tree: the codegen check reads
# crates/annals-log/gen, which `just gen` writes and git ignores.
gitignore = false

exclude_re = [
    # annals
    # A body that cannot run: no value of `Infallible` exists to call it on
    # (`match *self {}`), so whatever the mutant returns is never returned.
    '''replace <impl Payload for std::convert::Infallible>::to_any -> Any with Default::default\(\)$''',
    '''replace <impl Diagnostic for std::convert::Infallible>::code -> &'static str with ""$''',
    '''replace <impl Diagnostic for std::convert::Infallible>::code -> &'static str with "xyzzy"$''',
    '''replace <impl Diagnostic for std::convert::Infallible>::args -> Vec<\(&'static str, Arg\)> with vec!\[\]$''',
    # The mutant is the code: each already returns an empty Vec, so `vec![]`
    # changes nothing.
    '''replace <impl Payload for std::convert::Infallible>::type_urls -> Vec<String> with vec!\[\]$''',
    '''replace <impl Project for \(\)>::project -> Vec<ProjectorFailure> with vec!\[\]$''',
    '''replace EventStore::find_triggered -> Result<Vec<EventPage>, StoreError> with Ok\(vec!\[\]\)$''',
    # annals-store-sql
    # into_wal's busy guard. Taking a non-busy error for busy makes into_wal
    # run `BEGIN EXCLUSIVE` and try the move again: the same error comes back
    # on each try, or from `BEGIN EXCLUSIVE` itself, so the open still fails
    # with that error, only later. No test can tell the two apart.
    'crates/annals-store-sql/src/sqlite\.rs:\d+:\d+: replace match guard busy\(&error\) with true in into_wal$',
    'crates/annals-store-sql/src/sqlite\.rs:\d+:\d+: replace busy -> bool with true$',
    # annals-yaml
    # update_to's last check, that the edits reached the target, cannot fail:
    # reach returns Ok only once each differing entry is set and each edit
    # has read back as intended, so the guard is always true when reached.
    'replace match guard same\(&self\.value, target\) with true in Document::update_to',
]
