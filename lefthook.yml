# Git hooks, managed by lefthook (`just hooks-install`). The gates are the
# shared gates repository's lefthook.yml, reached through the `.gates` link
# (`just gates-link`); annals' parameters for them are in its justfile.
extends:
  - .gates/lefthook.yml

pre-commit:
  commands:
    gates:
      # First: lefthook skips an extends file it cannot read, so without this
      # a missing link would let the commit through with no gate run.
      priority: 0
      run: just gates-check
